[theme]
base = "light"
primaryColor = "#0A0A0A"
backgroundColor = "#F5F3EF"
secondaryBackgroundColor = "#EAE7E1"
textColor = "#0A0A0A"
linkColor = "#0A0A0A"
borderColor = "#D9D5CE"
showWidgetBorder = true
baseRadius = "4px"
buttonRadius = "full"
baseFontSize = 15
font = "Satoshi:https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"
headingFont = "Satoshi"

[theme.sidebar]
backgroundColor = "#EAE7E1"
secondaryBackgroundColor = "#F5F3EF"
borderColor = "#D9D5CE"

[client]
toolbarMode = "minimal"
