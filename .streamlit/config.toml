[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F5F6F8"
secondaryBackgroundColor = "#F3F4F6"
textColor = "#0F172A"
linkColor = "#4F46E5"
borderColor = "#E5E7EB"
showWidgetBorder = true
baseRadius = "8px"
baseFontSize = 15
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F8"
borderColor = "#E5E7EB"

[client]
toolbarMode = "minimal"
